name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: 版本号校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验 VERSION 规则
        run: python tools/version/check_version.py

  layers:
    name: 分层静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查四层主题与内容源分层约束
        run: python tools/ci/check_layers.py
      - name: 品牌卫生检查（禁止外部播放器品牌名）
        run: python tools/ci/check_brand_terms.py
      - name: 硬编码用户可见文案检查
        run: python tools/ci/check_hardcoded_text.py
      - name: i18n 完整性检查
        run: python tools/ci/check_i18n.py

  coverage:
    name: 单测覆盖率
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: linux_gcc_64
          cache: true

      - name: 安装依赖
        run: |
          sudo timeout 300 apt-get update || true
          sudo timeout 240 apt-get install -y --no-install-recommends libsodium23 gcovr

      - name: 覆盖率构建
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-cov --parallel 4

      - name: 运行全部单测
        run: ctest --test-dir build-cov --output-on-failure

      - name: 生成覆盖率报告（关键路径）
        # 关键路径范围：settings/theme(ThemeRegistry)/ui/media/core/diag 与更新清单/版本/签名。
        # 排除 GUI 装配层（app/window/mpv）、LayoutHost（QML 宿主）与需要真实网络/安装器的
        # UpdateService 状态机；这些由 M1 冒烟/性能证据覆盖，不计入行覆盖率。
        run: |
          gcovr -r . \
            --filter 'src/(settings|ui|media|core|diag)/' \
            --filter 'src/theme/ThemeRegistry' \
            --filter 'src/update/(UpdateManifest|Version|UpdateCrypto)' \
            --txt coverage.txt --xml coverage.xml --print-summary \
            --fail-under-line 70
          cat coverage.txt

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.xml
          if-no-files-found: warn

  build:
    name: 构建与常规检查（${{ matrix.name }}）
    needs: [version, layers]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt_arch: win64_msvc2022_64
          - name: macOS
            os: macos-latest
            qt_arch: clang_64
          - name: Linux
            os: ubuntu-latest
            qt_arch: linux_gcc_64
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Qt 6.9.3
        # macOS 26 SDK 移除了 AGL.framework，Qt 6.8.3（6.8 线最后一版）仍带 -framework AGL，
        # 在 macos-26-arm64 运行时链接必然失败；6.9 起已移除该依赖，故 CI 统一用 6.9.3。
        # 本地 Windows 仍可使用 Qt 6.8.3（CMake 要求 >= 6.8）。
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: 安装系统依赖（Linux）
        # libsodium 供清单签名单测；ffmpeg 生成冒烟样本；libmpv 供 headless 冒烟。
        # apt 镜像偶发卡住，加超时避免作业挂死。
        if: runner.os == 'Linux'
        run: |
          sudo timeout 300 apt-get update || echo "apt-get update 超时，沿用镜像自带索引"
          sudo timeout 240 apt-get install -y --no-install-recommends libsodium23 ffmpeg libmpv2

      - name: 安装系统依赖（macOS）
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg mpv libsodium
          # UpdateCrypto 通过 QLibrary 动态加载 libsodium；Homebrew 的 lib 目录
          # 不在 dyld 默认搜索路径，测试与冒烟进程需要显式传入。libmpv 同理。
          # 注意不要加 $(brew --prefix)/lib：那里有 Homebrew 自带的 libpng/libjpeg，
          # 会把系统 ImageIO 的 PNG 解码插件绑定到不兼容的副本（macOS 上表现为
          # 建窗时跳到无效地址的 SIGBUS）。只暴露确实需要的两个目录。
          echo "DYLD_LIBRARY_PATH=$(brew --prefix libsodium)/lib:$(brew --prefix mpv)/lib" >> "$GITHUB_ENV"

      - name: 缓存 Windows 运行时依赖
        # 依赖版本钉死在 fetch_win_runtime.ps1 里；用脚本体哈希做 key，
        # 升级版本后缓存自动失效。命中缓存时完全不联网。
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            third_party/libmpv
            third_party/libsodium
          key: win-runtime-${{ hashFiles('tools/release/fetch_win_runtime.ps1') }}

      - name: 安装运行时依赖（Windows）
        # 这一层只影响 headless 冒烟需要的 libmpv / libsodium / ffmpeg。
        # 编译与单测不依赖它们（CMake 缺文件时照常构建），所以：
        # - 失败不红整条矩阵（continue-on-error），下面用 outcome 决定是否跳过冒烟；
        # - 单独打印 ::warning::，问题仍然可见，不会被静默吞掉。
        id: win_runtime
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/release/fetch_win_runtime.ps1
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $ok = $false
            for ($i = 1; $i -le 3; $i++) {
              choco install ffmpeg -y --no-progress
              if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { $ok = $true; break }
              Write-Warning "ffmpeg 安装第 $i 次未成功，10 秒后重试"
              Start-Sleep -Seconds 10
            }
            if (-not $ok) { throw "ffmpeg 三次安装均失败" }
          }

      - name: 运行时依赖缺失告警（不阻断矩阵）
        if: runner.os == 'Windows' && steps.win_runtime.outcome != 'success'
        shell: pwsh
        run: |
          Write-Output "::warning::Windows 运行时依赖准备失败（网络或 SHA256 校验不通过）。"
          Write-Output "编译与单元测试继续执行；headless 冒烟跳过。其它平台矩阵不受影响。"

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build --config Release --parallel 4

      - name: 全部单元测试
        # Qt 运行时路径由 install-qt-action 注入 PATH，测试可找到 Qt6Test/平台插件。
        run: ctest --test-dir build -C Release --output-on-failure

      - name: 生成 20 个冒烟样本
        # Windows 上 ffmpeg 跟运行时依赖同属「外部下载」，缺失时跳过而不是把矩阵拉红。
        if: runner.os != 'Windows' || steps.win_runtime.outcome == 'success'
        shell: bash
        run: python tools/qa/gen_samples.py --out qa/runtime/samples

      - name: headless 冒烟（Linux）
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          PALUNE_CONFIG_DIR: ${{ github.workspace }}/qa/runtime/config-ci
        run: |
          BIN=$(find build -maxdepth 3 -type f -name Palune -perm -u+x | head -1)
          echo "二进制：$BIN"
          "$BIN" --m1-smoke --media qa/runtime/samples --report qa/runtime/m1-smoke.json

      - name: headless 冒烟（macOS）
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          PALUNE_CONFIG_DIR: ${{ github.workspace }}/qa/runtime/config-ci
          PALUNE_MPV_TRACE: "1"
        run: |
          APP=$(find build -type f -name Palune -path '*MacOS*' | head -1)
          echo "二进制：$APP"
          "$APP" --m1-smoke --media qa/runtime/samples --report qa/runtime/m1-smoke.json || {
            echo "冒烟失败，应用日志（末尾 60 行）："
            tail -60 qa/runtime/config-ci/logs/palune.log 2>/dev/null || true
            echo "崩溃面包屑："
            cat qa/runtime/config-ci/crashes/breadcrumbs.txt 2>/dev/null || true
            cat qa/runtime/config-ci/crashes/crash-*.json 2>/dev/null || true
            echo "lldb 回溯："
            xcrun lldb --batch -o run -o "thread backtrace all" -o quit -- \
              "$APP" --m1-smoke --media qa/runtime/samples --report qa/runtime/m1-smoke-lldb.json \
              2>&1 | tail -120 || true
            echo "macOS 崩溃报告（最近 3 份）："
            ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -4 || true
            LATEST=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
            [ -n "$LATEST" ] && head -80 "$LATEST" || true
            exit 1
          }

      - name: headless 冒烟（Windows）
        if: runner.os == 'Windows' && steps.win_runtime.outcome == 'success'
        shell: pwsh
        env:
          PALUNE_CONFIG_DIR: ${{ github.workspace }}/qa/runtime/config-ci
        run: |
          $p = Start-Process -FilePath ./build/Release/Palune.exe `
            -ArgumentList '--m1-smoke','--media','qa/runtime/samples','--report','qa/runtime/m1-smoke.json' `
            -PassThru -Wait
          exit $p.ExitCode

      - name: 上传冒烟报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-smoke-${{ matrix.name }}
          path: qa/runtime/m1-smoke.json
          if-no-files-found: warn

      - name: 记录 Windows 产物指纹
        # 用于核对 CI 构建与本地包的运行时依赖是否同一份（libmpv / libsodium / exe 版本）。
        if: runner.os == 'Windows' && success()
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @("build/Release/Palune.exe", "build/Release/libmpv-2.dll", "build/Release/libsodium.dll")) {
            if (Test-Path $f) {
              $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
              $size = (Get-Item $f).Length
              $lines += "$f|$size|$h"
            }
          }
          $lines | Out-File -Encoding utf8 build-fingerprint.txt
          Get-Content build-fingerprint.txt

      - name: 上传 Windows 产物指纹
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-fingerprint
          path: build-fingerprint.txt
          if-no-files-found: warn
