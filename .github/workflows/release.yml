name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 版本号校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验 VERSION 规则（不合规直接失败）
        run: python tools/version/check_version.py
      - name: 取出版本号与通道
        id: v
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-alpha*) echo "channel=alpha" >> "$GITHUB_OUTPUT" ;;
            *)        echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac
          # 预发布口径按 tag 判定：带 alpha/beta/RC **序号**后缀的 tag（-alphaN/-betaN/-RCn）
          # 一律按 prerelease 发布，不接管 releases/latest；VERSION 现在是 1.0.0-RC1，
          # 光看版本号会把 RC 误判成正式版。
          # 裸后缀（-RC / -alpha / -beta）直接失败：预发布必须带序号，不能用裸的 RC 反复发。
          TAG="${GITHUB_REF_NAME:-}"
          case "$TAG" in
            *-alpha|*-beta|*-RC|*-rc)
              echo "::error::tag $TAG 是裸后缀；预发布 tag 必须带序号，如 -alpha1、-beta1、-RC1"
              exit 1
              ;;
            *-alpha[0-9]*|*-beta[0-9]*|*-RC[0-9]*|*-rc[0-9]*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "版本 $VERSION tag=$TAG"

  windows:
    name: Windows 打包
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: win64_msvc2022_64
          cache: true

      - name: 准备运行时依赖（libmpv / libsodium）
        shell: pwsh
        run: ./tools/release/fetch_win_runtime.ps1

      - name: 确保 NSIS 可用
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build --config Release --parallel 4

      - name: 单元测试
        run: ctest --test-dir build -C Release --output-on-failure -R "version|manifest"

      - name: 校验许可 RTF 与源文本一致
        shell: pwsh
        run: |
          python tools/release/make_license_rtf.py
          if (git status --porcelain packaging/LICENSE.rtf) {
            throw "LICENSE.rtf 未随 LICENSE.txt 重新生成"
          }

      - name: 打包（NSIS + MSI）
        shell: pwsh
        run: ./tools/release/package_windows.ps1 -BuildDir build -OutDir dist

      - name: 安装 → 启动 → 卸载验证
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*-win-x64.exe" | Select-Object -First 1
          ./tools/release/verify_windows_install.ps1 -Installer $installer.FullName -OutDir dist/verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-evidence
          path: dist/verify/*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS 打包
    needs: version
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: clang_64
          cache: true

      - name: 准备运行时依赖（brew 的 libmpv / libsodium）
        run: |
          set -euo pipefail
          brew install mpv libsodium dylibbundler
          mkdir -p third_party/libmpv third_party/libsodium
          MPV_LIB="$(brew --prefix mpv)/lib/libmpv.dylib"
          [ -f "$MPV_LIB" ] || MPV_LIB="$(brew --prefix)/lib/libmpv.dylib"
          cp "$MPV_LIB" third_party/libmpv/libmpv.dylib
          cp "$(brew --prefix)/lib/libsodium.dylib" third_party/libsodium/libsodium.dylib
          ls -l third_party/libmpv third_party/libsodium

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build --config Release --parallel 4

      - name: 单元测试
        run: ctest --test-dir build -C Release --output-on-failure -R "version|manifest"

      - name: 打包（dmg）
        run: bash tools/release/package_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux 打包
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: linux_gcc_64
          cache: true

      - name: 安装系统依赖
        run: |
          set -uo pipefail
          sudo apt-get -o Acquire::Retries=5 update || echo "apt-get update 失败，沿用自带索引"
          ok=0
          for attempt in 1 2 3; do
            if sudo timeout 420 apt-get install -y --no-install-recommends libmpv2 libsodium23 rpm file; then
              ok=1; break
            fi
            echo "第 $attempt 次 apt 安装失败，10 秒后重试"
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "[FAIL] apt 安装依赖三次仍未成功" >&2; exit 1; fi
          mkdir -p third_party/libmpv third_party/libsodium
          cp /usr/lib/x86_64-linux-gnu/libmpv.so.2 third_party/libmpv/libmpv.so.2
          cp /usr/lib/x86_64-linux-gnu/libsodium.so.23 third_party/libsodium/libsodium.so.23
          ls -l third_party/libmpv third_party/libsodium

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build --config Release --parallel 4

      - name: 单元测试
        run: ctest --test-dir build -C Release --output-on-failure -R "version|manifest"

      - name: 打包（AppImage + deb + rpm）
        run: bash tools/release/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*
          if-no-files-found: error

  manifest:
    name: 生成 latest.json 与 SHA256SUMS
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装签名依赖
        run: python -m pip install --quiet cryptography

      - name: 生成清单
        env:
          PALUNE_UPDATE_PRIVATE_KEY: ${{ secrets.PALUNE_UPDATE_PRIVATE_KEY }}
          PALUNE_UPDATE_KEY_ID: ${{ secrets.PALUNE_UPDATE_KEY_ID }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          NOTES="$(git log -1 --pretty=%s)"
          python tools/release/gen_manifest.py \
            --dist dist \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --base-url "https://github.com/${RELEASE_REPO}/releases/download/${VERSION}" \
            --notes "$NOTES"
          echo "--- latest.json ---"
          cat dist/latest.json
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS

      - name: 断言清单与产物均已签名
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          m = json.load(open("dist/latest.json", encoding="utf-8"))
          sig = m.get("signature") or {}
          if not sig.get("value"):
              print("[FAIL] latest.json 未签名；客户端会拒绝未签名清单", file=sys.stderr)
              sys.exit(1)
          payload = m["payload"]
          if not payload.get("artifacts"):
              print("[FAIL] latest.json 缺少 artifacts", file=sys.stderr)
              sys.exit(1)
          for item in payload["artifacts"]:
              if not ((item.get("signature") or {}).get("value")):
                  print(f"[FAIL] 产物未签名：{item.get('platform')}/{item.get('arch')}", file=sys.stderr)
                  sys.exit(1)
          print(f"[OK] 已签名，keyId={sig.get('keyId')}，产物 {len(payload['artifacts'])} 个")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: 发布到本仓 Release
    needs: [version, manifest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: 上传到本仓 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # dist 里混有 Windows 安装验证输出目录（dist/verify），gh release 不接受目录；
          # 只挑顶层的文件作为发布资产。
          mapfile -t FILES < <(find dist -maxdepth 1 -type f | sort)
          echo "发布资产："
          printf '%s\n' "${FILES[@]}"
          # 预发布口径：tag 带 alpha/beta/RC 后缀一律 --prerelease，不接管 releases/latest。
          PRERELEASE_ARG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_ARG="--prerelease"
          fi
          echo "通道=$CHANNEL 预发布=$PRERELEASE 参数=${PRERELEASE_ARG:-（无）}"
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$RELEASE_REPO" $PRERELEASE_ARG \
              --title "Palune $VERSION" \
              --notes "Palune $VERSION 发行产物。更新清单见 latest.json，校验值见 SHA256SUMS。"
          fi
          gh release view "$TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name'

  assert-public-feed:
    name: 匿名可访问断言
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: 不带任何凭据 GET latest.json 与安装包
        run: |
          set -uo pipefail
          # 源码仓即发布仓。预发布不接管 releases/latest，因此断言走 tag 定点 URL；
          # 只有正式版才断言 latest 主链。
          if [ "$PRERELEASE" = "false" ]; then
            FEED="https://github.com/${RELEASE_REPO}/releases/latest/download/latest.json"
          else
            FEED="https://github.com/${RELEASE_REPO}/releases/download/${TAG}/latest.json"
          fi
          echo "预发布=$PRERELEASE 断言 URL=$FEED"
          HEADERS="$(mktemp)"
          CODE="$(curl -sSL -o feed.json -D "$HEADERS" -w '%{http_code}' --max-redirs 5 \
            --retry 6 --retry-delay 10 --retry-all-errors \
            -H 'Cache-Control: no-cache' "$FEED" || true)"
          echo "匿名 GET $FEED -> HTTP $CODE"
          echo "--- 原始响应头 ---"
          cat "$HEADERS"
          if [ "$CODE" != "200" ]; then
            echo "::error::更新源必须匿名可访问：HTTP $CODE（401/404 均视为失败）"
            exit 1
          fi
          python - <<'PY'
          import json, os, subprocess, sys
          feed = json.load(open("feed.json", encoding="utf-8"))
          payload = feed.get("payload") or {}
          version = payload.get("version", "")
          if not version:
              print("[FAIL] latest.json 里取不到 version 字段", file=sys.stderr)
              sys.exit(1)
          if version != os.environ["VERSION"]:
              print(f"[FAIL] latest.json version={version} 与本次发布 {os.environ['VERSION']} 不一致", file=sys.stderr)
              sys.exit(1)
          if not ((feed.get("signature") or {}).get("value")):
              print("[FAIL] latest.json 未签名", file=sys.stderr)
              sys.exit(1)
          print(f"[OK] 匿名清单 version={version}，已签名")
          for item in payload.get("artifacts", []):
              url = item["url"]
              out = subprocess.run(
                  ["curl", "-sSIL", "-o", "/dev/null", "-w", "%{http_code}",
                   "--retry", "6", "--retry-delay", "10", "--retry-all-errors", url],
                  capture_output=True, text=True, check=True)
              code = out.stdout.strip()
              print(f"     {item['platform']}/{item['arch']} 匿名 HEAD {code} {url}")
              if code != "200":
                  print(f"[FAIL] 安装包匿名不可下载：HTTP {code} {url}", file=sys.stderr)
                  sys.exit(1)
          print("[OK] 清单与安装包均可匿名访问")
          PY
